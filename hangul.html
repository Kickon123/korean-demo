<body>
<title>Hangul Show</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=M+PLUS+Rounded+1c:wght@500;800&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a 16:9 TV-show stage (1600×900) scaled to fit the window, so it reads well inside a Zoom/Meet share. One idea per slide, revealed step by step by the teacher. A slim control bar sits below the stage. */
:root{
  --sky:#BFE9FF; --sky2:#FFE7F3; --ink:#2B2350; --ink-soft:#5B5480; --paper:#FFFFFF;
  --sun:#FFC93C; --grass:#7ED957; --pink:#F15BB5; --line:#E4DDF7;
  --accent:#FF5A5F; --accent-soft:#FFE3E1; --accent-deep:#D93A40;
  --kana:"Jua","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --round:"Fredoka","M PLUS Rounded 1c","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;font-synthesis-weight:none}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--ink);font-family:var(--round);overflow:hidden;display:flex;flex-direction:column}
button,select{font-family:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:linear-gradient(160deg,var(--sky) 0%,#E7F7FF 55%,var(--sky2) 100%);border-radius:28px;overflow:hidden;font-size:40px}
.stage::before,.stage::after{content:"";position:absolute;border-radius:50%;background:#ffffff80}
.stage::before{width:260px;height:120px;left:60px;top:40px;box-shadow:120px 30px 0 -20px #ffffff80}
.stage::after{width:300px;height:130px;right:90px;top:70px;box-shadow:-140px 40px 0 -30px #ffffff80}
.slide{position:absolute;inset:0;padding:90px 80px 140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:1;animation:slideIn .45s cubic-bezier(.3,1.4,.5,1)}
.slide.back{animation:slideBack .35s ease-out}
@keyframes slideIn{from{transform:translateX(60px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes slideBack{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
[data-b]{opacity:0;transform:scale(.6);transition:opacity .35s,transform .45s cubic-bezier(.3,1.7,.5,1)}
[data-b].on{opacity:1;transform:none}
.kicker{position:absolute;top:34px;left:50%;transform:translateX(-50%);background:var(--paper);border:5px solid var(--ink);border-radius:999px;padding:6px 30px;font-weight:700;font-size:32px;box-shadow:0 6px 0 var(--ink);white-space:nowrap;z-index:2}
.kicker .jp{font-family:var(--kana);font-weight:800;color:var(--accent)}
h1,h2{margin:0;text-wrap:balance;text-align:center}
h2{font-size:60px;line-height:1.15}
.jpw{font-family:var(--kana);font-weight:800}

/* tutor */
.yuna-face{width:150px;height:150px;border-radius:50%;flex:none;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.talk{display:flex;align-items:center;gap:26px}
.bubble{background:var(--paper);border:5px solid var(--ink);border-radius:36px;padding:20px 34px;font-weight:600;font-size:44px;position:relative;box-shadow:0 8px 0 var(--ink);max-width:1100px;line-height:1.25}
.bubble::before{content:"";position:absolute;left:-22px;top:50%;width:30px;height:30px;background:var(--paper);border-left:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.bubble b{color:var(--accent-deep)}
.bubble .jpw{color:var(--pink)}
.corner-yuna{position:absolute;right:40px;bottom:100px;display:flex;align-items:flex-end;gap:16px;z-index:2}
.corner-yuna .yuna-face{width:130px;height:130px}

/* hello & bye */
.banner{width:820px;max-width:100%;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.hello-portrait{position:absolute;top:24px;left:34px;width:200px;height:auto;animation:pop .7s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 6px 0 #2B235033)}
.picker{position:absolute;right:30px;top:150px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:8px;background:#ffffffb3;border:4px solid var(--ink);border-radius:30px;padding:10px 8px}
.picker span{font-size:18px;font-weight:700}
.pick{width:58px;height:50px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-family:var(--kana);font-weight:800;font-size:30px;cursor:pointer;color:var(--ink);padding:0}
.pick.cur{background:var(--pink);color:#fff}
.review{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:1300px}
.review span{width:130px;height:130px;border-radius:34px;border:5px solid var(--ink);display:grid;place-items:center;font-family:var(--kana);font-weight:800;font-size:86px;color:#fff;box-shadow:0 7px 0 var(--ink)}
.hello-row{display:flex;align-items:center;gap:40px}
.wave{width:360px;animation:bob 2.6s ease-in-out infinite}
.today{display:flex;gap:18px}
.today span{width:110px;height:110px;border-radius:30px;border:5px solid var(--ink);display:grid;place-items:center;font-family:var(--kana);font-weight:800;font-size:72px;color:#fff;box-shadow:0 7px 0 var(--ink)}

/* meet */
.mega{width:520px;height:520px;border-radius:80px;border:8px solid var(--ink);background:var(--accent);color:#fff;font-family:var(--kana);font-weight:800;font-size:420px;line-height:1;display:grid;place-items:center;box-shadow:0 16px 0 var(--accent-deep),inset 0 -28px 0 #0001;animation:wobble 3.2s ease-in-out infinite}
.mega.boing{animation:boing .6s}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-8px)}}
@keyframes boing{30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.08)}100%{transform:none}}
.meet{display:flex;align-items:center;gap:70px}
.meet-side{display:flex;flex-direction:column;gap:30px;align-items:flex-start}
.romaji{font-size:150px;font-weight:700;line-height:1;color:var(--accent-deep);background:var(--paper);border:6px solid var(--ink);border-radius:40px;padding:10px 50px;box-shadow:0 10px 0 var(--ink)}
.times{display:flex;gap:22px}
.times span{width:110px;height:110px;border-radius:50%;background:var(--sun);border:5px solid var(--ink);display:grid;place-items:center;font-size:60px;font-weight:700;box-shadow:0 6px 0 var(--ink);transition:transform .3s}
.times span.lit{background:var(--grass);transform:scale(1.15)}

/* story */
.story{display:grid;grid-template-columns:auto 1fr;gap:60px;align-items:center;width:100%;max-width:1400px}
.mid{width:380px;height:380px;border-radius:60px;font-size:300px}
.cards{display:flex;flex-direction:column;gap:30px}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:36px;padding:24px 34px;box-shadow:0 8px 0 var(--ink);font-size:44px;line-height:1.3;display:flex;gap:24px;align-items:center}
.card .ic{font-size:90px;flex:none}
.card b{color:var(--accent-deep)}

/* write */
.write{display:flex;align-items:center;gap:70px}
.pad{width:540px;height:540px;background:var(--paper);border:8px solid var(--ink);border-radius:60px;box-shadow:0 14px 0 var(--ink);position:relative}
.pad svg{width:100%;height:100%}
.steps{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.count{display:flex;gap:20px}
.count span{width:120px;height:120px;border-radius:50%;border:6px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:70px;font-weight:700;box-shadow:0 7px 0 var(--ink);transition:background .2s,transform .2s}
.count span.lit{background:var(--accent);color:#fff;transform:scale(1.15)}
.hint{font-size:44px;font-weight:600;background:var(--paper);border:5px solid var(--ink);border-radius:30px;padding:16px 30px;box-shadow:0 7px 0 var(--ink)}

/* words */
.words{display:flex;gap:44px}
.word{width:400px;background:var(--paper);border:6px solid var(--ink);border-radius:46px;box-shadow:0 12px 0 var(--ink);padding:26px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden}
.word .pic{font-size:200px;line-height:1.1}
.word .w{white-space:nowrap;font-family:var(--kana);font-weight:800;font-size:76px;letter-spacing:.06em}
.word .w em{font-style:normal;color:var(--accent);text-decoration:underline wavy var(--sun) 6px;text-underline-offset:12px}
.word .r{font-size:34px;color:var(--ink-soft);font-weight:600}
.word .en{font-size:32px;background:var(--accent-soft);border-radius:999px;padding:2px 20px}
.cover{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr)}
.cover i{background:var(--accent);border:2px solid #ffffff55;transition:opacity .35s,transform .35s}
.cover i:nth-child(3n){background:var(--accent-deep)}
.cover.open i{opacity:0;transform:scale(.3) rotate(30deg)}
.cover .q{position:absolute;inset:0;display:grid;place-items:center;font-size:160px;font-weight:700;color:#fff;text-shadow:0 6px 0 #0003;transition:opacity .2s}
.cover.open .q{opacity:0}
.word .clue{position:absolute;top:18px;left:18px;right:18px;background:var(--sun);border:4px solid var(--ink);border-radius:20px;font-size:28px;font-weight:700;padding:6px 12px;text-align:center;z-index:3;transition:opacity .3s}
.word.shown .clue{opacity:0}

/* games */
.tiles{display:flex;gap:44px}
.tile{width:290px;height:330px;border-radius:50px;border:7px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--kana);font-weight:800;font-size:200px;box-shadow:0 12px 0 var(--ink);position:relative;transition:transform .3s,background .3s,opacity .3s}
.tile .n{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:var(--sun);border:5px solid var(--ink);font-family:var(--round);font-size:50px;display:grid;place-items:center}
.tiles.done .tile{opacity:.35;transform:scale(.92)}
.tiles.done .tile.right{opacity:1;background:var(--grass);transform:scale(1.12);animation:boing .6s}
.countdown{font-size:130px;font-weight:700;color:var(--pink);height:150px;line-height:150px;text-shadow:0 6px 0 var(--paper)}
.mystery{width:460px;height:460px;border-radius:70px;border:8px dashed var(--ink);background:var(--paper);display:grid;place-items:center;font-size:300px;font-weight:700;color:var(--pink);box-shadow:0 14px 0 var(--ink);position:relative}
.mystery .jpw{font-size:360px;color:var(--accent)}
.mystery.solved{border-style:solid;animation:boing .6s}
.ear{font-size:150px;animation:bob 1.4s ease-in-out infinite}
.wrongrow{display:flex;align-items:center;gap:60px}
.verdict{font-size:230px;line-height:1;width:300px;text-align:center}
.shout{display:flex;gap:30px}
.shout span{font-family:var(--kana);font-weight:800;font-size:56px;background:var(--paper);border:5px solid var(--ink);border-radius:30px;padding:10px 30px;box-shadow:0 7px 0 var(--ink)}
.shout .ok{color:#1E8F56}.shout .ng{color:#D93A40}
.flash{width:560px;height:560px;font-size:440px}
.flash.tick{animation:flashIn .3s ease-out}
@keyframes flashIn{from{transform:scale(.4) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.speed{display:flex;gap:16px;align-items:center;font-size:34px;font-weight:600}
.speed button{font-size:32px;font-weight:700;border:4px solid var(--ink);border-radius:20px;background:var(--paper);padding:6px 22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--sun)}
.mission{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.mission .m{background:var(--paper);border:6px solid var(--ink);border-radius:40px;padding:16px 26px;box-shadow:0 9px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;width:230px}
.mission .k{font-family:var(--kana);font-weight:800;font-size:110px;line-height:1.1;color:var(--c)}
.mission .ex{font-size:30px;color:var(--ink-soft);font-weight:600;text-align:center}
.timer{font-size:120px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper);border:6px solid var(--ink);border-radius:40px;padding:0 50px;box-shadow:0 10px 0 var(--ink)}
.timer.low{color:var(--accent-deep);animation:boing .5s}
.bigstars{font-size:150px;font-weight:700;display:flex;align-items:center;gap:20px}

/* star counter */
.stars{position:absolute;top:36px;right:360px;z-index:3;background:var(--paper);border:5px solid var(--ink);border-radius:999px;padding:6px 28px;font-weight:700;font-size:44px;box-shadow:0 6px 0 var(--ink);font-variant-numeric:tabular-nums;transition:transform .3s}
.stars.pop{animation:boing .6s}
.yuna-corner{position:absolute;top:18px;left:30px;z-index:3;display:flex;align-items:center;gap:12px;pointer-events:none}
.yuna-corner img{width:124px;height:124px;border-radius:50%;animation:bob 2.2s ease-in-out infinite}
.yuna-corner span{background:#fff;border:4px solid var(--ink);border-radius:999px;padding:2px 18px;font-family:var(--kana);font-weight:800;font-size:30px;color:var(--pink);box-shadow:0 5px 0 var(--ink)}
.voicebtn{position:absolute;top:20px;right:30px;z-index:5;height:104px;min-width:250px;padding:0 26px;border-radius:999px;border:6px solid var(--ink);background:#fff;box-shadow:0 8px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:14px;font-size:58px;line-height:1;cursor:pointer;transition:background .2s,transform .1s}
.voicebtn span{font-size:34px;font-weight:700;text-align:left;line-height:1.05}
.voicebtn span small{display:block;font-size:20px;font-weight:600;color:var(--ink-soft)}
.voicebtn.on{background:var(--grass)}
.voicebtn:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.progress{position:absolute;left:0;bottom:0;height:12px;background:var(--pink);z-index:3;transition:width .4s}
.notes{position:absolute;left:0;right:0;bottom:56px;background:#2B2350E6;color:#fff;padding:10px 40px;font-size:22px;line-height:1.35;z-index:4;font-weight:500;min-height:70px;display:block;padding-block:20px}
.notes b{color:var(--sun)}
.copy{position:absolute;left:30px;bottom:20px;z-index:6;font-size:20px;font-weight:600;color:var(--ink);background:#ffffffcc;border-radius:999px;padding:3px 16px;pointer-events:none}
.credit{position:absolute;right:40px;bottom:24px;z-index:6;font-size:18px;color:var(--ink-soft);z-index:2}

/* control bar */
.bar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:#fff;font-size:15px}
.bar button{background:#ffffff1a;border:2px solid #ffffff40;border-radius:12px;color:#fff;font-weight:600;font-size:15px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.bar button:hover{background:#ffffff33}
.bar kbd{font-family:var(--round);font-size:12px;background:#ffffff2a;border-radius:5px;padding:1px 6px}
.bar .pos{font-variant-numeric:tabular-nums;min-width:70px;text-align:center;font-weight:700}
.bar select{background:#ffffff1a;border:2px solid #ffffff40;border-radius:12px;color:#fff;font-weight:600;font-size:14px;padding:5px 8px;max-width:130px}
.bar select option{color:var(--ink)}
.bar .jump{max-width:170px}
.bar .moreb{display:none}
@media (max-width:900px),(max-height:560px){
 .bar{flex-wrap:nowrap;gap:5px;padding-block:4px calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));overflow-x:auto;justify-content:flex-start}
 .bar .lbl,.bar kbd,.bar .wide{display:none}
 .bar .moreb{display:flex}
 .bar.more .wide{display:flex}
 .bar.more select.wide{display:block}
 .bar.more .moreb{background:var(--sun);color:var(--ink)}
 .bar button{padding:4px 10px;font-size:18px;border-radius:10px;flex:none}
 .bar .pos{min-width:52px;font-size:13px;flex:none}
 .bar select{font-size:13px;padding:3px 4px;max-width:110px;flex:none}
 .stage{border-radius:12px}
}
@media (max-height:560px) and (orientation:landscape){
 body{flex-direction:row}
 .bar{flex-direction:column;justify-content:safe center;overflow-x:hidden;overflow-y:auto;width:calc(64px + env(safe-area-inset-right,0px));padding:4px env(safe-area-inset-right,0px) 4px 4px}
 .bar button{width:52px;justify-content:center;padding:4px 0}
 .bar .pos{min-width:0;font-size:11px}
 .bar select{max-width:56px;width:56px;font-size:11px}
 .bar.more{justify-content:flex-start}
}
/* letters with many strokes: smaller count circles */
.count:has(span:nth-child(6)) span{width:92px;height:92px;font-size:54px}.count:has(span:nth-child(6)){gap:14px}.count:has(span:nth-child(8)) span{width:76px;height:76px;font-size:44px;border-width:5px}.count:has(span:nth-child(8)){gap:10px}
.today{flex-wrap:wrap;max-width:620px;gap:12px}.today span{width:86px;height:86px;font-size:58px;border-radius:24px}
.mission{max-width:1380px;gap:16px}.mission .m{width:168px;padding:8px 10px;border-radius:30px}.mission .k{font-size:76px}.mission .ex{font-size:22px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function confetti(n=120){const W=fx.width=innerWidth,H=fx.height=innerHeight,go=!bits.length;for(let i=0;i<n;i++)bits.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.5,vx:(Math.random()-.5)*16,vy:-Math.random()*16-6,r:Math.random()*8+5,c:['#FF5A5F','#FF9F1C','#2EB872','#3A86FF','#9B5DE5','#FFC93C','#F15BB5'][i%7],a:Math.random()*6});if(go)requestAnimationFrame(loop)}

  S.push({part:`${x.k} Mouth & story`,color:x,builds:2,note:`Show your own mouth shape on camera and exaggerate it! Kids copy you. Then tell the story with a funny voice.`,

   build:b=>{if(b===1)speak(x.k)},sound:()=>speak(x.k)});
  S.push({part:`${x.k} Write it`,color:x,builds:2,note:`The letter draws itself in stroke order. Kids write in the <b>air with a big finger</b> and count the strokes out loud. Press <b>Space</b> to draw again. Then → for paper time.`,
   html:()=>kick(`Let's write ${tag} · ${x.strokes.length} stroke${x.strokes.length>1?'s':''}`)+`<div class="write"><div class="pad">${strokeSVG(x)}</div><div class="steps"><div class="hint">☝️ Write in the air with me!</div><div class="count">${x.strokes.map((_,j)=>`<span id="c${j}">${j+1}</span>`).join('')}</div><div class="hint" data-b="1">📝 Now write it on paper!</div><div class="hint" data-b="2" style="background:var(--sun)">📷 Show me! Hold it up to the camera!</div></div></div><div class="credit">Stroke order: standard Hangul order</div>`,
   enter:()=>drawStrokes(x),sound:()=>drawStrokes(x)});
  const wt=x.mode==='has'?`Words with ${tag} inside`:`Words with ${tag}`;
  S.push({part:`${x.k} Words`,color:x,builds:x.words.length*2,note:`Read the clue first and let kids <b>guess</b> before you press →. Next press uncovers the picture. Say the word together, then → again to repeat it.`,
   html:()=>kick(wt)+`<div class="words">${x.words.map((w,j)=>`<div class="word" id="w${j}"><span class="pic">${w[3]}</span><span class="w"${w[0].length>4?` style="font-size:${Math.floor(300/w[0].length)}px"`:''}>${mark(w[0],x.k)}</span><span class="r">${w[1]}</span><span class="en">${w[2]}</span><div class="clue">💭 ${w[4]}</div><div class="cover" id="cv${j}">${'<i></i>'.repeat(20)}<span class="q">?</span></div></div>`).join('')}</div>`,
   build:b=>{const j=Math.floor((b-1)/2),st=(b-1)%2;if(st===0){$('#cv'+j).classList.add('open');$('#w'+j).classList.add('shown');ding();setTimeout(()=>speak(x.words[j][0]),350)}else{speak(x.words[j][0]+', '+x.words[j][0])}},
   sound:(el,b)=>{const j=Math.max(0,Math.min(x.words.length-1,Math.floor((b-1)/2)));speak(b?x.words[j][0]:x.k)}});
 });
 /* games */
 S.push({part:'🎮 Game time!',builds:1,note:'Big energy! Explain the rule: <b>show the answer with your fingers</b> on camera.',
  html:()=>`<h2 style="font-size:110px">🎮 Game time! 🎉</h2>`+face(`Show me the answer with your <b>fingers</b>! ☝️✌️`)+`<div data-b="1">${todayTiles}</div>`,enter:()=>fanfare()});
 const optPool=t=>{let pool=L.filter(x=>x!==t);if(pool.length<3)pool=pool.concat(shuffle(review).slice(0,3-pool.length));if(pool.length<3)pool=pool.concat(shuffle(ALL.filter(x=>x.row!==li&&!pool.includes(x))).slice(0,3-pool.length));pool=pool.filter(x=>x.r!==t.r);return shuffle(pool).slice(0,3)};
 const rounds=shuffle(L).slice(0,Math.min(4,L.length));
 rounds.forEach((t,ri)=>{
  const opts=shuffle([t,...optPool(t)]);
  S.push({part:`🖐️ Finger game ${ri+1}`,color:t,builds:2,note:`Ask: <b>"Where is ${t.k}?"</b> Kids hold up <b>1, 2, 3 or 4 fingers</b>. Press → for the 3-2-1 countdown, then → to reveal.`,
   html:()=>kick(`🖐️ Finger game · ${ri+1} of ${rounds.length}`)+face(`Where is <span class="jpw" style="color:${t.c}">“${t.r}”</span>? Show me your fingers!`)+`<div class="tiles" id="tiles">${opts.map((o,j)=>`<div class="tile ${o===t?'right':''}"><span class="n">${j+1}</span>${o.k}</div>`).join('')}</div><div class="countdown" id="cd"></div>`,
   enter:()=>setTimeout(()=>speak(t.k),400),
   build:b=>{if(b===1)countdown('#cd');if(b===2){$('#cd').textContent='';$('#tiles').classList.add('done');ding();confetti(80);setTimeout(()=>speak(t.k),300)}},sound:()=>speak(t.k)});
 });
 const myst=shuffle(L.filter(x=>!x.rare)).slice(0,3);
 myst.forEach((t,ri)=>{
  S.push({part:`👂 Mystery sound ${ri+1}`,color:t,builds:1,note:`Say a sound from today's row (or turn the voice on and press <b>Space</b>). Kids <b>shout the letter</b> or point to it on their paper. Then → to reveal.`,
   html:()=>kick(`👂 Mystery sound · ${ri+1} of ${myst.length}`)+`<div class="ear">👂</div><div class="mystery" id="my">?</div><div class="hint" style="position:absolute;right:80px;bottom:170px;font-size:40px">Teacher says: <b class="jpw" style="color:${t.c}">“${t.r}”</b></div>`+face(`Listen! Which letter is it?`).replace('class="talk"','class="talk" style="position:absolute;left:60px;bottom:170px;transform:scale(.8);transform-origin:left bottom"'),
   enter:()=>setTimeout(()=>speak(t.k),500),
   build:()=>{const m=$('#my');m.innerHTML=`<span class="jpw">${t.k}</span>`;m.classList.add('solved');m.style.setProperty('--accent',t.c);ding();confetti(70);setTimeout(()=>speak(t.k),300)},sound:()=>speak(t.k)});
 });
 const tg=shuffle(L).slice(0,Math.min(4,L.length));
 const wr=tg.map((t,i)=>{const ok=i%2===0;let said=t;if(!ok){const pool=learned.filter(x=>x!==t&&x.r!==t.r);said=shuffle(pool.filter(x=>x.row===t.row).length?pool.filter(x=>x.row===t.row):pool)[0]}return{t,said,ok}});
 shuffle(wr).forEach((g,ri)=>{
  S.push({part:`🙅 Yes or no ${ri+1}`,color:g.t,builds:1,note:`Say the sound on Sensei's bubble. Is it right? Kids shout <b>"네!"</b> (ne, yes) with a thumbs up 👍, or <b>"아니요!"</b> (aniyo, no) with arms in an ✖. Then → to reveal.`,
   html:()=>kick(`🙅 Is Sensei right? · ${ri+1} of ${wr.length}`)+`<div class="wrongrow"><div class="mega mid" style="background:${g.t.c};box-shadow:0 16px 0 ${g.t.deep}">${g.t.k}</div><div class="verdict" id="vd">🤔</div></div>`+face(`This is <b>“${g.said.r}”</b>!`)+`<div class="shout"><span class="ok">👍 네!</span><span class="ng">✖ 아니요!</span></div>`,
   enter:()=>setTimeout(()=>speak(g.said.k),500),
   build:()=>{$('#vd').textContent=g.ok?'⭕':'❌';$('#vd').style.animation='boing .6s';if(g.ok){ding();confetti(60)}else{buzz();setTimeout(()=>speak(`아니에요! ${g.t.k}`),500)}},sound:()=>speak(g.said.k)});
 });
 S.push({part:'⚡ Fast flash',builds:0,note:`Press <b>Space</b> to start or stop. Letters flash, and everyone reads them out loud! Choose <b>Today</b> or <b>Review all</b> for every row learned so far.`,
  html:()=>kick('⚡ Fast flash! Read it out loud!')+`<div class="mega flash" id="fl">${L[0].k}</div><div class="speed"><span>Speed:</span><button data-sp="2200">🐢 Slow</button><button data-sp="1500" aria-pressed="true">🐰 Medium</button><button data-sp="900">🚀 Fast</button><span style="width:20px"></span><button data-set="today" aria-pressed="true">Today</button>${li>0?'<button data-set="all">Review all</button>':''}<span id="flst" style="margin-left:16px">⏸ Space</span></div>`,
  enter:()=>{flashSpeed=1500;flashSet=L;document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{flashSpeed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',x===b));if(flashT){stopFlash();startFlash()}});document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{flashSet=b.dataset.set==='all'?learned:L;document.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed',x===b))})},
  sound:()=>{flashT?stopFlash():startFlash()},leave:()=>stopFlash()});
 S.push({part:'🏠 Home mission',builds:1,note:`Kids run and find something at home with one of today's sounds, then show it on camera! Press <b>Space</b> for a 60-second timer. Give a ⭐ (S key) for every find.`,
  html:()=>kick('🏠 Mission: find it at home!')+face(false?'':`Find something that starts with...`)+`<div class="mission">${L.map(x=>`<div class="m" style="--c:${x.c}"><span class="k">${x.k}</span><span class="ex">${x.words.map(w=>w[3]).join(' ')}</span></div>`).join('')}</div><div class="timer" id="tm" data-b="1">1:00</div>`,
  enter:()=>{tmLeft=60},build:()=>{},sound:(el,b)=>{if(b<1){reveal()}toggleTimer()},leave:()=>stopTimer()});
 const nextRow=li<ROWS.length-1?ROWS[li+1][0]:null;
 S.push({part:'👋 Goodbye',builds:1,note:`Count the stars together! Press → for the celebration. Kids wave and say <b>"안녕!"</b> (annyeong, bye!).`,
  html:()=>`<img class="banner" src="${IMG.banner}" alt="선생님" style="width:620px"><div class="hello-row"><img class="wave" src="${IMG.wave}" alt="Sensei waving" style="width:300px"><div style="display:flex;flex-direction:column;gap:26px;align-items:flex-start"><div class="bubble">Great job today!<br>You learned <span class="jpw">${L.map(x=>x.k).join('')}</span>! 🌸${nextRow?`<br><span style="font-size:34px">Next time: <span style="color:var(--pink)">${ROWS[li+1][1]}</span></span>`:'<br><span style="font-size:34px">You can read Korean letters! 🏆</span>'}</div><div class="bigstars">⭐ × <span id="bigN">${stars}</span></div><div class="bubble" data-b="1" style="font-size:60px"><span class="jpw">안녕!</span> See you!</div></div></div>`,
  build:()=>{fanfare();confetti(220);speak('안녕!')},sound:()=>speak('안녕!')});
}

/* ---------- helpers ---------- */
function boingMega(){const m=$('#mega');if(!m)return;m.classList.remove('boing');void m.offsetWidth;m.classList.add('boing')}
function strokeSVG(x){
 return `<svg viewBox="0 0 109 109" aria-label="Stroke order for ${x.r}">
  <line x1="54.5" y1="4" x2="54.5" y2="105" stroke="#E4DDF7" stroke-width=".8" stroke-dasharray="3 3"/><line x1="4" y1="54.5" x2="105" y2="54.5" stroke="#E4DDF7" stroke-width=".8" stroke-dasharray="3 3"/>
  ${x.strokes.map((d,j)=>`<path d="${d}"${x.tf?` transform="${x.tf[j]}"`:''} fill="none" stroke="${x.soft}" stroke-width="${x.sw?x.sw[j]:8}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
  ${x.strokes.map((d,j)=>`<path class="st" id="s${j}" d="${d}"${x.tf?` transform="${x.tf[j]}"`:''} fill="none" stroke="${x.c}" stroke-width="${x.sw?x.sw[j]:8}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
  ${x.nums.map((n,j)=>`<g class="num" id="n${j}" opacity="0"><circle cx="${n[0]-2}" cy="${n[1]-4}" r="5.2" fill="#FFC93C" stroke="#2B2350" stroke-width="1"/><text x="${n[0]-2}" y="${n[1]-1.6}" font-size="7" font-weight="700" text-anchor="middle" fill="#2B2350" font-family="Fredoka,sans-serif">${j+1}</text></g>`).join('')}
 </svg>`;
}
let drawTimers=[];
function drawStrokes(x){
 drawTimers.forEach(clearTimeout);drawTimers=[];
 const paths=[...document.querySelectorAll('.st')];
 paths.forEach((p,j)=>{const len=p.getTotalLength();p.style.transition='none';p.style.strokeDasharray=len;p.style.strokeDashoffset=len;const n=$('#n'+j);if(n)n.setAttribute('opacity','0');const c=$('#c'+j);if(c)c.classList.remove('lit')});
 let t=500;
 paths.forEach((p,j)=>{
  const len=p.getTotalLength(),dur=Math.max(900,len*28);
  drawTimers.push(setTimeout(()=>{const n=$('#n'+j);if(n)n.setAttribute('opacity','1');document.querySelectorAll('.count span').forEach(s=>s.classList.remove('lit'));const c=$('#c'+j);if(c)c.classList.add('lit');tick();p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`;p.style.strokeDashoffset=0},t));
  t+=dur+450;
 });
 drawTimers.push(setTimeout(()=>{document.querySelectorAll('.count span').forEach(s=>s.classList.remove('lit'));speak(x.k)},t));
}
let cdT=[];
function countdown(sel){cdT.forEach(clearTimeout);cdT=[];['3','2','1'].forEach((n,i)=>cdT.push(setTimeout(()=>{const e=$(sel);if(e){e.textContent=n+'…';tick()}},i*800)));cdT.push(setTimeout(()=>{const e=$(sel);if(e)e.textContent='👀'},2400))}
let flashT=null,flashSpeed=1500,lastF=-1,flashSet=[];
function startFlash(){const st=$('#flst');if(st)st.textContent='▶ Flashing…';const step=()=>{const el=$('#fl');if(!el){stopFlash();return}let i;const F=flashSet.length?flashSet:L;do{i=Math.floor(Math.random()*F.length)}while(i===lastF&&F.length>1);lastF=i;el.textContent=F[i].k;el.style.background=F[i].c;el.style.boxShadow=`0 16px 0 ${F[i].deep}`;el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');tick()};step();flashT=setInterval(step,flashSpeed)}
function stopFlash(){clearInterval(flashT);flashT=null;const st=$('#flst');if(st)st.textContent='⏸ Press Space'}
let tmT=null,tmLeft=60;
function toggleTimer(){if(tmT){stopTimer();return}const el=$('#tm');if(!el)return;if(tmLeft<=0)tmLeft=60;tmT=setInterval(()=>{tmLeft--;const e=$('#tm');if(!e){stopTimer();return}e.textContent=`0:${String(tmLeft).padStart(2,'0')}`;if(tmLeft<=10){e.classList.remove('low');void e.offsetWidth;e.classList.add('low');tick()}if(tmLeft<=0){stopTimer();e.textContent='⏰ Time\'s up!';fanfare();confetti(120)}},1000)}
function stopTimer(){clearInterval(tmT);tmT=null}

/* ---------- engine ---------- */
let cur=0,b=0,stars=0;
try{stars=+(sessionStorage.getItem('show-stars')||0)}catch(e){}
function setTheme(x){const r=$('#stage').style;x=x||{c:'#F15BB5',soft:'#FDE0F1',deep:'#C62F8A'};r.setProperty('--accent',x.c);r.setProperty('--accent-soft',x.soft);r.setProperty('--accent-deep',x.deep)}
function show(i,dir){
 const old=S[cur];if(old&&old.leave)old.leave();
 drawTimers.forEach(clearTimeout);cdT.forEach(clearTimeout);
 cur=Math.max(0,Math.min(S.length-1,i));const s=S[cur];
 setTheme(s.color);
 b=dir==='back'?(s.builds||0):0;
 $('#slot').innerHTML=`<section class="slide ${dir==='back'?'back':''}">${s.html()}</section>`;
 if(dir==='back')document.querySelectorAll('[data-b]').forEach(e=>e.classList.add('on'));
 if(dir==='back'&&s.part.includes('Words')){for(let j=0;j<3;j++){const c=$('#cv'+j);if(c){c.classList.add('open');$('#w'+j).classList.add('shown')}}}
 $('#notes').innerHTML='📝 '+s.note;
 $('#pos').textContent=`${cur+1} / ${S.length}`;
 $('#prog').style.width=((cur+1)/S.length*100)+'%';
 $('#jump').value=String(jumpIndex());
 if(s.enter&&dir!=='back')s.enter();
 if(s.enter&&dir==='back'&&s.part.includes('Write'))s.enter();
 if(s.enter&&dir==='back'&&s.part.includes('flash'))s.enter();
 $('#ycorner').hidden=!!$('#slot').querySelector('.yuna-face,.wave');
 try{history.replaceState(null,'','#L'+(lesson+1)+'-s'+(cur+1))}catch(e){}
}
function reveal(){const s=S[cur];if(b>=(s.builds||0))return false;b++;document.querySelectorAll(`[data-b="${b}"]`).forEach(e=>e.classList.add('on'));if(s.build)s.build(b,$('#slot'));return true}
function next(){if(!reveal())if(cur<S.length-1)show(cur+1)}
function prev(){if(cur>0)show(cur-1,'back')}
function sound(){const s=S[cur];if(s.sound)s.sound($('#slot'),b)}
function addStar(d=1){stars=Math.max(0,stars+d);try{sessionStorage.setItem('show-stars',stars)}catch(e){}$('#starN').textContent=stars;const bn=$('#bigN');if(bn)bn.textContent=stars;const el=$('#stars');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');if(d>0){ding();confetti(40)}}
$('#starN').textContent=stars;
function full(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
let notesOn=false;function toggleNotes(){notesOn=!notesOn;$('#notes').hidden=!notesOn}

/* jump menu: first slide of each part */
let JUMPS=[];
function buildJumps(){JUMPS=[];S.forEach((s,i)=>{const kana=/^[\u3131-\u318E\uAC00-\uD7A3]/.test(s.part);const key=s.part.replace(/ \d+$/,'');const g=kana?s.part.split(' ')[0]:key;if(!JUMPS.length||JUMPS[JUMPS.length-1].g!==g)JUMPS.push({g,i,label:kana?`${s.part.split(' ')[0]} letter`:key})});$('#jump').innerHTML=JUMPS.map((j,n)=>`<option value="${n}">↪ ${j.label}</option>`).join('')}
function loadLesson(li,at){const old=S[cur];if(old&&old.leave)old.leave();stopFlash();stopTimer();buildSlides(li);buildJumps();$('#lessonSel').value=String(li);cur=0;show(at||0)}
$('#lessonSel').innerHTML=ROWS.map((r,i)=>`<option value="${i}">📚 ${r[1]}</option>`).join('');
$('#lessonSel').onchange=e=>{loadLesson(+e.target.value);e.target.blur()};
function jumpIndex(){let n=0;JUMPS.forEach((j,k)=>{if(j.i<=cur)n=k});return n}
$('#jump').onchange=e=>{show(JUMPS[+e.target.value].i);e.target.blur()};

$('#ycimg').src=IMG.face;
function setVoice(on){voiceOn=on;const b=$('#voiceBtn');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.innerHTML=on?'🔊<span>Voice ON<small>Computer talks</small></span>':'🔇<span>Voice OFF<small>Teacher talks</small></span>';if(on)tone([[988,.16],[1319,.32]]);else if('speechSynthesis' in window)speechSynthesis.cancel()}
$('#voiceBtn').onclick=e=>{e.stopPropagation();setVoice(!voiceOn);e.currentTarget.blur()};
$('#bVoice').onclick=()=>setVoice(!voiceOn);
function leaveTo(url){if('speechSynthesis' in window)speechSynthesis.cancel();location.href=url}
$('#bHome').onclick=()=>leaveTo('index.html');
$('#bLogout').onclick=()=>{if(confirm('Log out?'))leaveTo('index.html?staticrypt_logout')};
$('#bMore').onclick=e=>{const on=$('.bar').classList.toggle('more');e.currentTarget.setAttribute('aria-expanded',on);fit()};
$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bSound').onclick=sound;$('#bStar').onclick=()=>addStar(1);$('#bNotes').onclick=toggleNotes;$('#bFull').onclick=full;
let tx=null,ty=null,swiped=false;
$('#vp').addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;swiped=false},{passive:true});
$('#vp').addEventListener('touchend',e=>{if(tx===null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;dx<0?next():prev()}},{passive:true});
$('#stage').addEventListener('click',e=>{if(swiped){swiped=false;return}const pb=e.target.closest('[data-lesson]');if(pb){loadLesson(+pb.dataset.lesson);return}if(e.target.closest('button'))return;next()});
addEventListener('keydown',e=>{
 if(e.target.tagName==='SELECT')return;
 const k=e.key;
 if(k==='ArrowRight'||k==='PageDown'||k==='Enter'){e.preventDefault();next()}
 else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev()}
 else if(k===' '){e.preventDefault();sound()}
 else if(k==='s'||k==='S'){addStar(e.shiftKey?-1:1)}
 else if(k==='n'||k==='N'){toggleNotes()}
 else if(k==='v'||k==='V'){setVoice(!voiceOn)}
 else if(k==='f'||k==='F'){full()}
 else if(k==='Home'){show(0)}
 else if(k==='End'){show(S.length-1)}
});

/* scale stage to window */
function fit(){const vp=$('#vp'),w=vp.clientWidth,h=vp.clientHeight,sc=Math.min(w/1600,h/900)*.98;$('#stage').style.transform=`translate(-50%,-50%) scale(${sc})`}
addEventListener('resize',fit);new ResizeObserver(fit).observe($('#vp'));fit();
{const m=location.hash.match(/^#L(\d+)-s(\d+)$/);const li=m?Math.min(ROWS.length-1,Math.max(0,+m[1]-1)):0;buildSlides(li);buildJumps();$('#lessonSel').value=String(li);show(m?(+m[2]-1):0)}
document.fonts&&document.fonts.ready.then(fit);
</script>

</body>
